[package]
name = "falsegreen-ledger-web"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "The web front end for the falsegreen-ledger audit trail: an axum API + a server-rendered Dioxus board (full stack, one Rust workspace)."
default-run = "falsegreen-ledger-web"

[dependencies]
falsegreen-ledger = { path = "..", version = "0.2.0" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dioxus = { version = "=0.7.10", features = ["ssr"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
